<section class="wrap page-head">
  <div class="breadcrumbs" id="crumbs"><a href="/">Domov</a><span>/</span><span>Inzeráty</span></div>
  <h1 id="offersTitle" tabindex="-1">Inzeráty</h1>
  <div class="subcats" id="subcats" hidden></div>
</section>
<section class="wrap results-layout" id="offers">
  <aside class="filters-panel" id="filters" aria-label="Filtre">
    <div class="filters-head"><h2>Filtre</h2><button type="button" class="modal-close filters-close" id="filtersClose" aria-label="Zavrieť filtre">{{ICON:close}}</button></div>
    <fieldset><legend>Typ</legend><div class="segmented" role="group"><button type="button" data-mode="sell">Predám</button><button type="button" data-mode="buy">Kúpim</button></div></fieldset>
    <fieldset><legend>Kategória</legend><select id="categorySelect" aria-label="Kategória"></select><select id="subSelect" aria-label="Podkategória" hidden></select></fieldset>
    <fieldset><legend>Lokalita</legend><input id="location" type="search" list="placeList" placeholder="PSČ alebo obec" autocomplete="off" maxlength="100" aria-label="PSČ alebo obec"><select id="distance" aria-label="Okolie"><option value="0">len v obci</option><option value="10">do 10 km</option><option value="25">do 25 km</option><option value="50">do 50 km</option><option value="100">do 100 km</option></select></fieldset>
    <fieldset><legend>Cena (€)</legend><div class="price-range"><input type="number" id="min" min="0" inputmode="decimal" placeholder="od" aria-label="Cena od"><input type="number" id="max" min="0" inputmode="decimal" placeholder="do" aria-label="Cena do"></div></fieldset>
    <fieldset><legend>Stav</legend><select id="condition" aria-label="Stav"><option value="">Akýkoľvek</option><option value="Nové">Nové</option><option value="Používané">Používané</option></select></fieldset>
    <label class="checkbox-row"><input type="checkbox" id="withPhoto"> <span>Len s fotografiou</span></label>
    <button class="btn btn-line" id="resetFilters" type="button">Vymazať filtre</button>
    <button class="btn btn-ink filters-apply" id="filtersApply" type="button">Zobraziť výsledky</button>
  </aside>
  <div>
    <div class="toolbar"><div class="toolbar-count" id="resultCount" role="status">Načítavam…</div><div class="toolbar-actions"><button type="button" class="btn btn-line filters-button" id="filtersOpen">{{ICON:filter}}Filtre<span id="filterCount"></span></button><label><span class="sr">Zoradenie</span><select id="sort"><option value="recent">Najnovšie</option><option value="low">Najlacnejšie</option><option value="high">Najdrahšie</option></select></label><div class="view-toggle" role="group" aria-label="Zobrazenie"><button type="button" data-view="rows" aria-label="Zoznam" aria-pressed="true">{{ICON:list}}</button><button type="button" data-view="grid" aria-label="Mriežka" aria-pressed="false">{{ICON:grid}}</button></div></div></div>
    <div class="active-filters" id="activeFilters"></div>
    <p id="filterError" class="form-error" role="alert"></p>
    <div class="rows" id="results" aria-busy="true"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div>
    <div id="empty" class="empty" hidden><h3>Nič sme nenašli</h3><p>Skús iný výraz, väčší okruh alebo širšie cenové rozpätie.</p><button type="button" class="btn btn-line" id="emptyReset">Vymazať filtre</button></div>
    <nav class="pager" id="pager" aria-label="Stránkovanie" hidden></nav>
  </div>
</section>
